spring.application.name=notification-service
server.port=9010
spring.threads.virtual.enabled=true
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Email (SMTP) detail sourced from EMT_Bancassurance_Backend ConfigServer (notification-service.yml).
# Secret is externalized: export RESILIRE_MAIL_PASSWORD rather than committing the plaintext password.
resilire.notification.email.host=zmail.emtechhouse.co.ke
resilire.notification.email.port=465
resilire.notification.email.username=Banca-noreply@emtechhouse.co.ke
resilire.notification.email.password=${RESILIRE_MAIL_PASSWORD:}
resilire.notification.email.from=Banca-noreply@emtechhouse.co.ke
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# Distributed tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
