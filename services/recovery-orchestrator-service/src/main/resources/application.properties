spring.application.name=recovery-orchestrator-service
server.port=9006
spring.threads.virtual.enabled=true
spring.datasource.url=jdbc:postgresql://localhost:5433/recovery
spring.datasource.username=resilire
spring.datasource.password=resilire
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=recovery-orchestrator-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8085/realms/resilire
resilire.recovery.auto-enabled=false
resilire.rights-claims.base-url=http://localhost:9007
resilire.outbox.relay-delay-ms=2000
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# Distributed tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
