spring.application.name=resilience-score-service
server.port=9003
spring.threads.virtual.enabled=true
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=resilience-score-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8085/realms/resilire
resilire.ml-serving.base-url=http://localhost:8000
resilire.ml-serving.timeout-ms=800
resilire.score.cache-ttl-seconds=3600
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# Distributed tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
